services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-op}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-op_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-operator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-op}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-op}:${POSTGRES_PASSWORD:-op_pass_change_me}@db:5432/${POSTGRES_DB:-operator}
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      MEDIA_DIR: /data/media
      SESSION_DIR: /data/sessions
    volumes:
      - appdata:/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-op}:${POSTGRES_PASSWORD:-op_pass_change_me}@db:5432/${POSTGRES_DB:-operator}
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      MEDIA_DIR: /data/media
    volumes:
      - appdata:/data
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      # 配好证书后打开 443
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  redisdata:
  appdata:
